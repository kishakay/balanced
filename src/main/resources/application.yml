spring:
  application:
    name: article-service

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/articles}
    username: ${DB_USERNAME:articles}
    password: ${DB_PASSWORD:articles}
    driver-class-name: org.postgresql.Driver

  jpa:
    open-in-view: false
    hibernate:
      # Schema changes are owned by Flyway; Hibernate validates against the migrated schema.
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8080}

logging:
  level:
    org.springframework.boot.autoconfigure: INFO
    org.flywaydb: INFO
