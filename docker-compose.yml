services:
  postgres:
    image: postgres:16-alpine
    container_name: article-service-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-articles}
      POSTGRES_USER: ${POSTGRES_USER:-articles}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-articles}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - article_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-articles} -d ${POSTGRES_DB:-articles}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  article_pgdata:
