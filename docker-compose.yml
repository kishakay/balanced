services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: balanced
      POSTGRES_USER: balanced
      POSTGRES_PASSWORD: balanced
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U balanced -d balanced"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - balanced_pg:/var/lib/postgresql/data

  api:
    build: .
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: jdbc:postgresql://db:5432/balanced
      DATABASE_USERNAME: balanced
      DATABASE_PASSWORD: balanced
      SEED_DEMO_DATA: "true"
    depends_on:
      db:
        condition: service_healthy

volumes:
  balanced_pg:
