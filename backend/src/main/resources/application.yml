spring:
  application:
    name: balanced
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/balanced}
    username: ${DATABASE_USERNAME:balanced}
    password: ${DATABASE_PASSWORD:balanced}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  web:
    resources:
      static-locations: classpath:/static/
  mvc:
    throw-exception-if-no-handler-found: true
  webflux:
    problemdetails:
      enabled: false

server:
  port: ${PORT:8080}
  error:
    include-message: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

balanced:
  seed-demo-data: ${SEED_DEMO_DATA:true}

logging:
  level:
    com.balanced: INFO
